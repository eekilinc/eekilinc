name: optik_mobile
description: Optik mobil - hesap ile giris, optik form tara ve kaydet (Flutter).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  google_mlkit_barcode_scanning: ^0.13.0
  image: ^4.2.0
  path_provider: ^2.1.4
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/form-spec-v1.json
