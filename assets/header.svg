<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Window Frame Card -->
  <rect x="4" y="4" width="1192" height="252" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern Background -->
  <rect x="5" y="42" width="1190" height="213" fill="url(#grid)" rx="0 0 14 14"/>

  <!-- Window Title Bar -->
  <path d="M4 18 C4 10.268 10.268 4 18 4 L1182 4 C1189.732 4 1196 10.268 1196 18 L1196 42 L4 42 Z" fill="#0d1322"/>
  <line x1="4" y1="42" x2="1196" y2="42" stroke="#1e293b" stroke-width="1.5"/>

  <!-- macOS Window Controls -->
  <circle cx="28" cy="23" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="23" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="23" r="6.5" fill="#10b981"/>

  <!-- Terminal Window Title -->
  <text x="600" y="27" text-anchor="middle" class="font-mono" font-size="13" font-weight="500" fill="#94a3b8">
    ekrem@workstation: ~/workspace/portfolio (zsh)
  </text>

  <!-- Host Status Pill -->
  <g transform="translate(1080, 15)">
    <rect width="90" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <circle cx="12" cy="9" r="3.5" fill="#22c55e"/>
    <text x="22" y="13" class="font-mono" font-size="10" font-weight="600" fill="#cbd5e1">STABLE</text>
  </g>

  <!-- Terminal Command Prompt -->
  <g transform="translate(42, 78)">
    <text class="font-mono" font-size="15" fill="#22c55e" font-weight="bold">➜</text>
    <text x="20" class="font-mono" font-size="15" fill="#38bdf8" font-weight="bold">portfolio</text>
    <text x="105" class="font-mono" font-size="15" fill="#94a3b8">git:(</text>
    <text x="145" class="font-mono" font-size="15" fill="#f43f5e">main</text>
    <text x="180" class="font-mono" font-size="15" fill="#94a3b8">)</text>
    <text x="198" class="font-mono" font-size="15" fill="#e2e8f0">$</text>
    <text x="216" class="font-mono" font-size="15" fill="#f8fafc" font-weight="500">whoami --verbose --interests="AI, Computer Vision, Robotics"</text>
  </g>

  <!-- Developer Name with Gradient & Glow -->
  <text x="42" y="146" class="font-sans" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Ekrem Eşref Kılınç
  </text>

  <!-- Subtitle with Terminal Geek Style -->
  <text x="44" y="184" class="font-mono" font-size="18" font-weight="600" fill="#f1f5f9">
    <tspan fill="#38bdf8">[DEV]</tspan> Software Engineer  •  <tspan fill="#a855f7">[AI]</tspan> Computer Vision Researcher  •  <tspan fill="#ec4899">[EDU]</tspan> Educator
  </text>

  <!-- Tech tags / Highlight line -->
  <text x="44" y="218" class="font-mono" font-size="13" fill="#94a3b8">
    <tspan fill="#22c55e">✓</tspan> Flutter &amp; Android Compose  <tspan fill="#475569">|</tspan>  <tspan fill="#22c55e">✓</tspan> Deep Learning &amp; OpenCV  <tspan fill="#475569">|</tspan>  <tspan fill="#22c55e">✓</tspan> Embedded &amp; IoT  <tspan fill="#475569">|</tspan>  <tspan fill="#22c55e">✓</tspan> Full-Stack Architecture
  </text>

  <!-- Bottom Accent Gradient Line -->
  <rect x="4" y="254" width="1192" height="3" fill="url(#accentLine)" rx="1.5"/>
</svg>
