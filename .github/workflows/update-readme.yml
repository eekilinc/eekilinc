name: Update Profile README

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-readme:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README repositories section
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py

      - name: Generate stats assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME_GH: ${{ github.repository_owner }}
          OUTPUT_DIR: assets
        run: |
          python scripts/generate_stats.py

      - name: Smoke test generated assets
        run: |
          python -m py_compile scripts/update_readme.py scripts/generate_stats.py
          python -c "import glob, xml.dom.minidom; [xml.dom.minidom.parse(f) for f in glob.glob('assets/*.svg')]; print('SVG validation OK')"
          test -f assets/stats.svg
          test -f assets/languages.svg
          test -f assets/streak.svg

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update profile stats"

          git push
